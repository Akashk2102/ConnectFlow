<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectFlow — AI Customer Communication & Integration Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [apiKey, setApiKey] = useState(localStorage.getItem("cf_api_key") || "sk_test_secret_12345");
      const [metrics, setMetrics] = useState(null);
      const [conversations, setConversations] = useState([]);
      const [selectedConv, setSelectedConv] = useState(null);
      const [pendingActions, setPendingActions] = useState([]);
      const [failedRequests, setFailedRequests] = useState([]);
      const [simulatedText, setSimulatedText] = useState("Where is my package for order ORD-1042?");
      const [simulatedPhone, setSimulatedPhone] = useState("+14155552671");
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState("conversations");

      const headers = {
        "Content-Type": "application/json",
        "X-API-Key": apiKey
      };

      // Load Metrics, Conversations, Pending Actions
      const refreshData = async () => {
        try {
          // 1. Fetch Metrics
          const mRes = await fetch("/api/v1/metrics/system", { headers });
          if (mRes.ok) setMetrics(await mRes.json());

          // 2. Fetch Conversations
          const cRes = await fetch("/api/v1/conversations?limit=50", { headers });
          if (cRes.ok) {
            const convs = await cRes.json();
            setConversations(convs);
            if (convs.length > 0 && !selectedConv) {
              loadTranscript(convs[0].id);
            }
          }

          // 3. Fetch Pending Approvals
          const pRes = await fetch("/api/v1/workflow/actions/pending", { headers });
          if (pRes.ok) setPendingActions(await pRes.json());

          // 4. Fetch Failed Requests
          const fRes = await fetch("/api/v1/metrics/failed-requests", { headers });
          if (fRes.ok) setFailedRequests(await fRes.json());
        } catch (err) {
          console.error("Error refreshing dashboard data:", err);
        }
      };

      const loadTranscript = async (convId) => {
        try {
          const res = await fetch(`/api/v1/conversations/${convId}/messages`, { headers });
          if (res.ok) setSelectedConv(await res.json());
        } catch (err) {
          console.error("Error loading transcript:", err);
        }
      };

      useEffect(() => {
        localStorage.setItem("cf_api_key", apiKey);
        refreshData();
        const interval = setInterval(refreshData, 5000);
        return () => clearInterval(interval);
      }, [apiKey]);

      // Approve Action
      const handleApprove = async (actionId) => {
        try {
          const res = await fetch(`/api/v1/workflow/actions/${actionId}/approve`, {
            method: "POST",
            headers,
            body: JSON.stringify({ approved_by: "supervisor@connectflow.com" })
          });
          if (res.ok) {
            refreshData();
            if (selectedConv) loadTranscript(selectedConv.id);
          }
        } catch (err) {
          alert("Approval failed: " + err);
        }
      };

      // Reject Action
      const handleReject = async (actionId) => {
        const reason = prompt("Enter justification for rejection:", "Does not meet refund policy criteria");
        if (!reason) return;
        try {
          const res = await fetch(`/api/v1/workflow/actions/${actionId}/reject`, {
            method: "POST",
            headers,
            body: JSON.stringify({ reason, rejected_by: "supervisor@connectflow.com" })
          });
          if (res.ok) {
            refreshData();
            if (selectedConv) loadTranscript(selectedConv.id);
          }
        } catch (err) {
          alert("Rejection failed: " + err);
        }
      };

      // Trigger Inbound Webhook Simulator
      const handleSendSimulatedWebhook = async () => {
        setLoading(true);
        try {
          const uuid = "sim_" + Math.random().toString(36).substring(2, 10);
          const res = await fetch("/api/v1/webhooks/inbound", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Bypass-Signature": "true"
            },
            body: JSON.stringify({
              From: simulatedPhone,
              To: "+18005550199",
              Text: simulatedText,
              MessageUUID: uuid,
              Type: "sms"
            })
          });
          if (res.ok) {
            setTimeout(() => {
              refreshData();
              setLoading(false);
            }, 800);
          } else {
            setLoading(false);
            alert("Webhook failed: " + (await res.text()));
          }
        } catch (err) {
          setLoading(false);
          alert("Error sending test webhook: " + err);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navbar */}
          <header className="bg-slate-900 text-white px-6 py-4 flex flex-wrap justify-between items-center shadow-md">
            <div className="flex items-center space-x-3">
              <div className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                <i className="fa-solid fa-network-wired text-xl"></i>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight">ConnectFlow</h1>
                <p className="text-xs text-slate-400">AI-Powered Customer Communication & Integration Platform</p>
              </div>
            </div>

            <div className="flex items-center space-x-4 mt-2 sm:mt-0">
              <div className="flex items-center bg-slate-800 rounded-lg px-3 py-1.5 border border-slate-700">
                <span className="text-xs text-slate-400 mr-2 font-mono">API Key:</span>
                <input
                  type="password"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  placeholder="Enter X-API-Key"
                  className="bg-transparent text-xs text-indigo-300 focus:outline-none w-36 font-mono"
                />
              </div>

              <div className="flex items-center space-x-2">
                <span className="flex h-2.5 w-2.5 relative">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span className="text-xs text-emerald-400 font-medium">Live Gateway Active</span>
              </div>
            </div>
          </header>

          {/* Metrics Summary Strip */}
          <section className="bg-white border-b border-slate-200 px-6 py-4">
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-slate-500 uppercase">Conversations</div>
                <div className="text-2xl font-bold text-slate-800 mt-1">{metrics?.conversations?.total || 0}</div>
                <div className="text-xs text-slate-500 mt-0.5">{metrics?.conversations?.active || 0} active · {metrics?.conversations?.pending_human || 0} pending human</div>
              </div>

              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-slate-500 uppercase">Human Approvals</div>
                <div className="text-2xl font-bold text-amber-600 mt-1">{metrics?.pending_human_approvals || 0}</div>
                <div className="text-xs text-amber-600 font-medium mt-0.5">Sensitive actions awaiting review</div>
              </div>

              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-slate-500 uppercase">Total Messages</div>
                <div className="text-2xl font-bold text-slate-800 mt-1">{metrics?.messages?.total || 0}</div>
                <div className="text-xs text-slate-500 mt-0.5">Inbound & Outbound</div>
              </div>

              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-slate-500 uppercase">Open Tickets</div>
                <div className="text-2xl font-bold text-indigo-600 mt-1">{metrics?.open_tickets || 0}</div>
                <div className="text-xs text-slate-500 mt-0.5">Support queue active</div>
              </div>

              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                <div className="text-xs font-semibold text-slate-500 uppercase">Integration Health</div>
                <div className="flex items-center space-x-2 mt-2">
                  <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded text-xs font-semibold">Plivo OK</span>
                  <span className="px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded text-xs font-semibold">Gemini OK</span>
                </div>
              </div>
            </div>
          </section>

          {/* Main Workspace Layout */}
          <main className="flex-1 px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Conversations List & Inbound Simulator (4 cols) */}
            <div className="lg:col-span-4 flex flex-col space-y-6">
              
              {/* Inbound Webhook Message Simulator */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div className="flex items-center space-x-2 mb-3">
                  <i className="fa-solid fa-mobile-screen text-indigo-600"></i>
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Test Inbound Customer SMS</h2>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-500 block mb-1">Customer Phone Number</label>
                    <input
                      type="text"
                      value={simulatedPhone}
                      onChange={(e) => setSimulatedPhone(e.target.value)}
                      className="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 block mb-1">Customer Message</label>
                    <textarea
                      rows="2"
                      value={simulatedText}
                      onChange={(e) => setSimulatedText(e.target.value)}
                      className="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    ></textarea>
                  </div>
                  <div className="flex space-x-2">
                    <button
                      onClick={() => setSimulatedText("Where is my package for order ORD-1042?")}
                      className="text-[10px] bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded text-slate-700"
                    >
                      Order Inquiry
                    </button>
                    <button
                      onClick={() => setSimulatedText("I want a refund for ORD-9900, it arrived damaged!")}
                      className="text-[10px] bg-amber-50 hover:bg-amber-100 px-2 py-1 rounded text-amber-800"
                    >
                      Sensitive Refund
                    </button>
                    <button
                      onClick={() => setSimulatedText("What are your business hours?")}
                      className="text-[10px] bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded text-slate-700"
                    >
                      General FAQ
                    </button>
                  </div>
                  <button
                    onClick={handleSendSimulatedWebhook}
                    disabled={loading}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs py-2 px-4 rounded-lg flex items-center justify-center space-x-2 transition"
                  >
                    {loading ? (
                      <span><i className="fa-solid fa-spinner fa-spin mr-1"></i> Processing AI...</span>
                    ) : (
                      <span><i className="fa-solid fa-paper-plane mr-1"></i> Trigger Inbound Webhook</span>
                    )}
                  </button>
                </div>
              </div>

              {/* Conversations List */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Conversations ({conversations.length})</h2>
                  <button onClick={refreshData} className="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
                    <i className="fa-solid fa-rotate-right"></i>
                  </button>
                </div>

                <div className="divide-y divide-slate-100 overflow-y-auto max-h-[420px] custom-scrollbar">
                  {conversations.length === 0 ? (
                    <div className="p-6 text-center text-xs text-slate-400">
                      No customer conversations yet. Use the simulator above to start one!
                    </div>
                  ) : (
                    conversations.map((c) => (
                      <div
                        key={c.id}
                        onClick={() => loadTranscript(c.id)}
                        className={`p-3 cursor-pointer transition flex justify-between items-start ${
                          selectedConv?.id === c.id ? "bg-indigo-50 border-l-4 border-indigo-600" : "hover:bg-slate-50"
                        }`}
                      >
                        <div>
                          <div className="flex items-center space-x-1.5">
                            <span className="text-xs font-semibold text-slate-800 font-mono">
                              {c.id.substring(0, 8)}...
                            </span>
                            <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded uppercase">
                              {c.channel}
                            </span>
                          </div>
                          <div className="text-[11px] text-slate-500 mt-1">
                            Updated: {new Date(c.updated_at).toLocaleTimeString()}
                          </div>
                        </div>

                        <div>
                          <span
                            className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${
                              c.status === "active"
                                ? "bg-emerald-100 text-emerald-800"
                                : c.status === "pending_human"
                                ? "bg-amber-100 text-amber-800 animate-pulse"
                                : "bg-slate-100 text-slate-700"
                            }`}
                          >
                            {c.status}
                          </span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* Middle Column: Chat Transcript & AI Classification Details (5 cols) */}
            <div className="lg:col-span-5 flex flex-col space-y-6">
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col min-h-[550px] overflow-hidden">
                <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                  <div>
                    <h2 className="text-sm font-bold text-slate-800">
                      {selectedConv ? `Transcript: ${selectedConv.id.substring(0, 8)}` : "Conversation Transcript"}
                    </h2>
                    <p className="text-[11px] text-slate-500">Live AI intent classification & tool execution log</p>
                  </div>
                  {selectedConv && (
                    <span className="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded font-medium uppercase">
                      Channel: {selectedConv.channel}
                    </span>
                  )}
                </div>

                {/* Messages Feed */}
                <div className="flex-1 p-4 overflow-y-auto space-y-4 max-h-[500px] custom-scrollbar bg-slate-50/50">
                  {!selectedConv || selectedConv.messages?.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-slate-400 text-xs py-16">
                      <i className="fa-regular fa-comments text-4xl mb-2 text-slate-300"></i>
                      Select a conversation on the left to inspect its messages and AI decisions.
                    </div>
                  ) : (
                    selectedConv.messages.map((m) => (
                      <div
                        key={m.id}
                        className={`flex flex-col ${
                          m.direction === "inbound" ? "items-start" : "items-end"
                        }`}
                      >
                        <div className="flex items-center space-x-1.5 mb-1 text-[11px] text-slate-400">
                          <span className="font-semibold text-slate-600">
                            {m.direction === "inbound" ? "Customer" : "ConnectFlow AI Agent"}
                          </span>
                          <span>•</span>
                          <span>{new Date(m.created_at).toLocaleTimeString()}</span>
                        </div>

                        <div
                          className={`max-w-[85%] rounded-2xl p-3.5 shadow-sm text-xs leading-relaxed ${
                            m.direction === "inbound"
                              ? "bg-white border border-slate-200 text-slate-800 rounded-tl-none"
                              : "bg-indigo-600 text-white rounded-tr-none"
                          }`}
                        >
                          {m.content}
                        </div>

                        <div className="flex items-center space-x-2 mt-1 text-[10px] text-slate-400">
                          <span>Status: <span className="font-medium text-slate-600">{m.status}</span></span>
                          {m.provider_message_id && (
                            <span>• UUID: <span className="font-mono">{m.provider_message_id.substring(0, 12)}</span></span>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* Right Column: Human-in-the-Loop Approvals & Failed Requests (3 cols) */}
            <div className="lg:col-span-3 flex flex-col space-y-6">
              
              {/* Human Approval Desk */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center space-x-2">
                    <i className="fa-solid fa-shield-halved text-amber-500"></i>
                    <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Human Approvals</h2>
                  </div>
                  <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded-full">
                    {pendingActions.length}
                  </span>
                </div>

                <p className="text-xs text-slate-500 mb-4">
                  Sensitive actions (financial refunds or order cancellations) requiring manager authorization.
                </p>

                <div className="space-y-3">
                  {pendingActions.length === 0 ? (
                    <div className="p-4 bg-slate-50 border border-dashed border-slate-200 rounded-lg text-center text-xs text-slate-400">
                      <i className="fa-solid fa-circle-check text-emerald-500 text-xl block mb-1"></i>
                      All sensitive operations are clear. Zero pending actions.
                    </div>
                  ) : (
                    pendingActions.map((a) => (
                      <div key={a.id} className="border border-amber-200 bg-amber-50/50 rounded-xl p-3.5 space-y-2">
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-bold text-slate-800 font-mono">{a.action_type}</span>
                          <span className="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-semibold uppercase">
                            Gated
                          </span>
                        </div>
                        <div className="bg-white rounded p-2 text-[11px] font-mono border border-amber-100 text-slate-700">
                          {JSON.stringify(a.payload, null, 2)}
                        </div>
                        <div className="flex space-x-2 pt-1">
                          <button
                            onClick={() => handleApprove(a.id)}
                            className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs py-1.5 rounded-lg flex items-center justify-center space-x-1"
                          >
                            <i className="fa-solid fa-check mr-1"></i> Approve
                          </button>
                          <button
                            onClick={() => handleReject(a.id)}
                            className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs py-1.5 rounded-lg flex items-center justify-center space-x-1"
                          >
                            <i className="fa-solid fa-xmark mr-1"></i> Reject
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* Failed Requests Log */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex-1 flex flex-col">
                <div className="flex items-center space-x-2 mb-3">
                  <i className="fa-solid fa-triangle-exclamation text-rose-500"></i>
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Failed Requests</h2>
                </div>

                <div className="space-y-2 overflow-y-auto max-h-[220px] custom-scrollbar flex-1">
                  {failedRequests.length === 0 ? (
                    <div className="p-4 text-center text-xs text-slate-400">
                      No failed requests. Systems functioning smoothly.
                    </div>
                  ) : (
                    failedRequests.map((f, i) => (
                      <div key={i} className="p-2.5 bg-rose-50/60 border border-rose-100 rounded-lg text-xs">
                        <div className="flex justify-between items-center text-rose-800 font-semibold text-[11px]">
                          <span>{f.action_type}</span>
                          <span className="text-[10px] text-slate-400">{new Date(f.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <div className="text-[11px] text-rose-700 mt-1">{f.error_message}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
